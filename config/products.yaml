# Products to track for stock alerts.
#
# Fields:
#   store  - which checker module to use (see checkers/__init__.py for supported stores)
#   label  - human-readable name shown in Discord alerts
#   url    - direct product page link (used in the alert; also used as the state key)
#   sku    - store-specific product ID, required by some checkers (e.g. bestbuy)
#
# Stores implemented: bestbuy, pokemoncenter, target, walmart
# (bestbuy is reliable; the other three are best-effort - see README's
# "Notes on reliability" section)
# Products for a store with no matching checker are skipped with a
# warning, not an error, so it's safe to list stores ahead of support.
#
# home_zip - your zip code, used to compute distance to the nearest
# physical store with the item in stock. Optional; leave blank to skip
# distance scoring entirely. Currently only used by the bestbuy checker
# (the only store with a reliable public per-store inventory API).

home_zip: "REPLACE_ZIP"

products:
  - store: bestbuy
    label: "Pokemon TCG Scarlet & Violet Booster Box"
    url: "https://www.bestbuy.com/site/REPLACE-ME.p?skuId=REPLACE_SKU"
    sku: "REPLACE_SKU"
